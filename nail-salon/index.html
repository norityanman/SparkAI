<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ネイルサロン予約</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root {
    color-scheme: light;
    --header: #0f9ea8;
    --on-primary: #ffffff;
    --accent-text: #0b7a82;
    --hover: #f6fcfc;
    --th: #f7fbfb;
    --err: #b4505a;
    --sun: #c0646b;
    --sat: #4f7fb0;
    --debug-bg: #fff3d6;
    --debug-text: #7a5520;
    --overlay: rgba(20, 40, 42, .45);
    --primary: #0f9ea8;
    --primary-dark: #0b7a82;
    --primary-soft: #e3f5f6;
    --primary-line: #b6e2e5;
    --bg: #f5fafa;
    --card: #ffffff;
    --text: #29393b;
    --muted: #6b7f81;
    --line: #dde8e9;
    --disabled: #eef1f1;
    --disabled-text: #a9b5b6;
    --warn-bg: #fff7ec;
    --warn-line: #f1d7ad;
    --warn-text: #7a5520;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --header: #0d6f76; --on-primary: #ffffff; --accent-text: #74d6dd;
    --primary: #1597a1; --primary-dark: #0f7d86; --primary-soft: #16383b; --primary-line: #2b5c61;
    --bg: #0f1a1c; --card: #172426; --text: #e2eced; --muted: #9bb0b2; --line: #2a3b3e;
    --disabled: #1f2e30; --disabled-text: #5f7578; --hover: #1c2f31; --th: #1a2a2c;
    --warn-bg: #33291a; --warn-line: #65502d; --warn-text: #f0d3a4; --err: #f08a93;
    --sun: #e98d93; --sat: #8fb6de; --debug-bg: #3a2f17; --debug-text: #f0d3a4; --overlay: rgba(0, 0, 0, .6);
    color-scheme: dark;
  } }
  :root[data-theme="dark"] {
    --header: #0d6f76; --on-primary: #ffffff; --accent-text: #74d6dd;
    --primary: #1597a1; --primary-dark: #0f7d86; --primary-soft: #16383b; --primary-line: #2b5c61;
    --bg: #0f1a1c; --card: #172426; --text: #e2eced; --muted: #9bb0b2; --line: #2a3b3e;
    --disabled: #1f2e30; --disabled-text: #5f7578; --hover: #1c2f31; --th: #1a2a2c;
    --warn-bg: #33291a; --warn-line: #65502d; --warn-text: #f0d3a4; --err: #f08a93;
    --sun: #e98d93; --sat: #8fb6de; --debug-bg: #3a2f17; --debug-text: #f0d3a4; --overlay: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.7;
  }
  header.site {
    background: var(--header);
    color: var(--on-primary);
  }
  .site-inner {
    max-width: 880px;
    margin: 0 auto;
    padding-block: 14px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .brand { font-size: 1.15rem; font-weight: 700; letter-spacing: .04em; }
  .brand small { display: block; font-size: .75rem; font-weight: 400; opacity: .9; letter-spacing: 0; }
  .view-switch { display: flex; background: rgba(255,255,255,.18); border-radius: 999px; padding: 3px; }
  .view-switch button {
    border: 0; background: transparent; color: var(--on-primary); font: inherit; font-size: .9rem;
    padding: 6px 14px; border-radius: 999px; cursor: pointer;
  }
  .view-switch button.on { background: var(--card); color: var(--accent-text); font-weight: 700; }
  main { max-width: 880px; margin: 0 auto; padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 1.35rem; margin: 4px 0 6px; }
  h2 { font-size: 1.1rem; margin: 0 0 10px; }
  p { margin: 0 0 10px; }
  .muted { color: var(--muted); font-size: .92rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 16px;
  }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .choice {
    display: block; width: 100%; text-align: left;
    background: var(--card); border: 2px solid var(--line); border-radius: var(--radius);
    padding: 16px; font: inherit; color: inherit; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .choice:hover { border-color: var(--primary-line); background: var(--hover); }
  .choice.on { border-color: var(--primary); background: var(--primary-soft); }
  .choice .t { font-weight: 700; font-size: 1.05rem; }
  .choice .s { color: var(--muted); font-size: .9rem; }
  .big-choice { padding: 24px 20px; }
  .big-choice .t { font-size: 1.15rem; color: var(--accent-text); }

  .btn {
    display: inline-block; border: 0; border-radius: 999px; font: inherit; cursor: pointer;
    padding: 11px 24px; font-weight: 700; text-decoration: none;
  }
  .btn-primary { background: var(--primary); color: var(--on-primary); }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-primary:disabled { background: var(--disabled); color: var(--disabled-text); cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--accent-text); border: 1.5px solid var(--primary-line); }
  .btn-ghost:hover { background: var(--primary-soft); }
  .btn-quiet { background: transparent; color: var(--muted); border: 1.5px solid var(--line); }
  .btn-small { padding: 5px 14px; font-size: .88rem; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; margin-top: 18px; }
  .actions.end { justify-content: flex-end; }

  .steps { display: flex; gap: 6px; margin: 4px 0 18px; padding: 0; list-style: none; flex-wrap: wrap; }
  .steps li {
    flex: 1 1 0; min-width: 70px; text-align: center; font-size: .8rem; color: var(--muted);
    padding: 6px 4px; border-bottom: 3px solid var(--line);
  }
  .steps li.done { color: var(--accent-text); border-color: var(--primary-line); }
  .steps li.now { color: var(--accent-text); border-color: var(--primary); font-weight: 700; }

  .summary { background: var(--primary-soft); border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; }
  .summary dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; margin: 0; }
  .summary dt { color: var(--muted); font-size: .9rem; }
  .summary dd { margin: 0; font-weight: 700; }

  /* Calendar */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-head .m { font-weight: 700; }
  .cal-nav { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; width: 38px; height: 38px; cursor: pointer; font-size: 1rem; color: var(--accent-text); }
  .cal-nav:disabled { color: var(--disabled-text); cursor: not-allowed; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .wd { text-align: center; font-size: .78rem; color: var(--muted); padding-bottom: 2px; }
  .cal .wd.sun { color: var(--sun); } .cal .wd.sat { color: var(--sat); }
  .day {
    aspect-ratio: 1 / 1; border-radius: 10px; border: 1.5px solid var(--primary-line);
    background: var(--card); font: inherit; cursor: pointer; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 0; color: var(--text); font-size: .95rem;
  }
  .day small { font-size: .62rem; line-height: 1; color: var(--muted); }
  .day:hover:not(:disabled) { background: var(--primary-soft); }
  .day:disabled { background: var(--disabled); border-color: transparent; color: var(--disabled-text); cursor: not-allowed; }
  .day:disabled small { color: var(--disabled-text); }
  .day.on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .day.on small { color: var(--on-primary); }
  .day.work { background: var(--primary-soft); border-color: var(--primary); }
  .day.today { outline: 2px dashed var(--primary-line); outline-offset: 1px; }
  .day.empty { visibility: hidden; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); margin-top: 8px; }
  .legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .legend .l-ok::before { background: var(--card); border: 1.5px solid var(--primary-line); }
  .legend .l-no::before { background: var(--disabled); }
  .legend .l-on::before { background: var(--primary); }
  .legend .l-work::before { background: var(--primary-soft); border: 1.5px solid var(--primary); }

  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; }
  .slot {
    border: 1.5px solid var(--primary-line); background: var(--card); border-radius: 10px; padding: 8px 4px;
    font: inherit; cursor: pointer; color: var(--text);
  }
  .slot:hover:not(:disabled) { background: var(--primary-soft); }
  .slot:disabled { background: var(--disabled); border-color: transparent; color: var(--disabled-text); cursor: not-allowed; text-decoration: line-through; }
  .slot.on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); font-weight: 700; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 680px) { .cols { grid-template-columns: 1fr; } }

  label.f { display: block; margin-bottom: 12px; }
  label.f span { display: block; font-size: .9rem; color: var(--muted); margin-bottom: 4px; }
  input[type=text], input[type=tel], input[type=number], input[type=datetime-local], select {
    width: 100%; font: inherit; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text);
  }
  input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .err { color: var(--err); font-size: .88rem; margin-top: 4px; }

  .note {
    background: var(--primary-soft); border-left: 4px solid var(--primary); border-radius: 8px;
    padding: 10px 14px; font-size: .92rem; margin: 12px 0;
  }
  .gentle {
    background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn-text);
    border-radius: 12px; padding: 14px 16px; margin: 12px 0;
  }
  .done-no { font-size: 2rem; font-weight: 700; color: var(--accent-text); letter-spacing: .08em; }
  .badge { display: inline-block; font-size: .75rem; padding: 1px 10px; border-radius: 999px; background: var(--primary-soft); color: var(--accent-text); font-weight: 700; }
  .badge.gray { background: var(--disabled); color: var(--muted); }

  /* Shop */
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
  .tabs button {
    border: 0; background: transparent; font: inherit; padding: 8px 14px; cursor: pointer; color: var(--muted);
    border-bottom: 3px solid transparent; margin-bottom: -1px;
  }
  .tabs button.on { color: var(--accent-text); border-color: var(--primary); font-weight: 700; }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 12px; }
  .filters label.f { margin: 0; min-width: 160px; }
  .day-group { margin-bottom: 16px; }
  .day-group h3 { font-size: 1rem; margin: 0 0 6px; color: var(--accent-text); }
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; background: var(--card); }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 400; font-size: .82rem; background: var(--th); }
  tr.cancelled td { color: var(--disabled-text); text-decoration: line-through; }
  tr.cancelled td.st { text-decoration: none; }
  .row-form { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 8px; align-items: center; margin-bottom: 8px; }
  @media (max-width: 600px) { .row-form { grid-template-columns: 1fr 1fr; } }
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    background: var(--primary-dark); color: var(--on-primary); padding: 10px 20px; border-radius: 999px;
    font-size: .92rem; box-shadow: 0 6px 20px rgba(0,0,0,.15); z-index: 10; max-width: calc(100% - 32px);
  }
  .debug-banner { background: var(--debug-bg); color: var(--debug-text); text-align: center; font-size: .85rem; padding: 6px 16px; }
  .overlay { position: fixed; inset: 0; background: var(--overlay); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
  .dialog { background: var(--card); color: var(--text); border-radius: var(--radius); padding: 20px; max-width: 440px; width: 100%; }
  .dialog .actions { margin-top: 12px; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--primary-line); outline-offset: 2px; }
</style>
</head>
<body>
<header class="site">
  <div class="site-inner">
    <div class="brand">ネイルサロン<small>Web ご予約</small></div>
    <div class="view-switch" role="tablist">
      <button data-act="view" data-v="customer" id="sw-customer">お客様</button>
      <button data-act="view" data-v="shop" id="sw-shop">お店の方</button>
    </div>
  </div>
</header>
<div id="debug"></div>
<main id="app"></main>
<div id="toast"></div>
<div id="dialog"></div>

<script>
'use strict';

/* ===== 決まりごと(あとでお店の方が決めたら入れかえます) ===== */
const OPEN_MIN = 10 * 60;   // 営業開始 10:00(仮)
const CLOSE_MIN = 19 * 60;  // 営業終了 19:00(仮)
const STEP_MIN = 30;        // 30分ごとに予約を受けつける(仮)
const DAYS_AHEAD = 30;      // 30日先まで予約を受けつける(仮)
const DEADLINE_HOUR = 18;   // 予約日の前日18時まで、キャンセル・変更ができる
const STORE_KEY = 'nail-salon-yoyaku-v1';

/* ===== 日付の道具 ===== */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const hm = m => `${Math.floor(m / 60)}:${pad(m % 60)}`;
const WD = '日月火水木金土';
const fmtDate = s => { const d = fromYmd(s); return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日(${WD[d.getDay()]})`; };
const fmtDateShort = s => { const d = fromYmd(s); return `${d.getMonth() + 1}月${d.getDate()}日(${WD[d.getDay()]})`; };
const fmtDateTime = d => `${d.getMonth() + 1}月${d.getDate()}日(${WD[d.getDay()]}) ${d.getHours()}:${pad(d.getMinutes())}`;
const yen = n => '¥' + Number(n).toLocaleString('ja-JP');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const normPhone = s => String(s).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[^0-9]/g, '');

/* ===== 保存 ===== */
let storageOK = true;
let data = load();

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { storageOK = false; }
  const d = seed();
  persist(d);
  return d;
}
function persist(d = data) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(d)); } catch (e) { storageOK = false; }
}

/* 見本のデータ(名前も電話番号もすべて作り物です) */
function seed() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const staff = [
    { id: 's1', name: '見本 さくら', pattern: [1, 2, 3, 5, 6] }, // 月火水金土
    { id: 's2', name: '見本 あおい', pattern: [0, 2, 4, 5, 6] }, // 日火木金土
  ].map(s => {
    const days = [];
    for (let i = 0; i <= 60; i++) { const d = addDays(today, i); if (s.pattern.includes(d.getDay())) days.push(ymd(d)); }
    return { id: s.id, name: s.name, workDays: days };
  });
  const menus = [
    { id: 'm1', name: 'ワンカラー', minutes: 60, price: 5500 },
    { id: 'm2', name: 'グラデーション', minutes: 90, price: 6600 },
    { id: 'm3', name: 'アート(お好きなデザイン)', minutes: 120, price: 8800 },
    { id: 'm4', name: 'ケア・ジェルオフのみ', minutes: 30, price: 3300 },
  ];
  const firstWork = (s, from) => s.workDays.find(d => d >= ymd(addDays(today, from)));
  const d1 = firstWork(staff[0], 2), d2 = firstWork(staff[1], 3);
  const mk = (no, sId, mId, date, start, name, phone) => {
    const m = menus.find(x => x.id === mId);
    return { id: no, staffId: sId, menuId: mId, menuName: m.name, minutes: m.minutes, price: m.price,
             date, start, name, phone, status: 'active', createdAt: new Date().toISOString() };
  };
  const bookings = [
    mk('N1001', 's1', 'm1', d1, 11 * 60, '見本 花子', '09000000000'),
    mk('N1002', 's1', 'm3', d1, 14 * 60, '見本 次郎', '08000000000'),
    mk('N1003', 's2', 'm2', d2, 10 * 60 + 30, '見本 桃子', '07000000000'),
  ];
  return { staff, menus, bookings, debugNow: null };
}

/* ===== ルール ===== */
function now() { return data.debugNow ? new Date(data.debugNow) : new Date(); }
function todayYmd() { return ymd(now()); }
function lastYmd() { return ymd(addDays(fromYmd(todayYmd()), DAYS_AHEAD)); }
const staffById = id => data.staff.find(s => s.id === id);
function menuById(id) {
  // 日にち変更のとき、メニューが変わっていたら予約したときの内容を使う
  if (id === '__booking__' && ui.bk.editingId) {
    const b = data.bookings.find(x => x.id === ui.bk.editingId);
    return { id, name: b.menuName, minutes: b.minutes, price: b.price };
  }
  return data.menus.find(m => m.id === id);
}
const staffName = id => (staffById(id) || { name: '(登録なし)' }).name;

function slotsFor(staffId, date, minutes, excludeId) {
  const busy = data.bookings.filter(b => b.status === 'active' && b.staffId === staffId && b.date === date && b.id !== excludeId);
  const closed = isClosed(date);
  const out = [];
  for (let t = OPEN_MIN; t < CLOSE_MIN; t += STEP_MIN) {
    let ok = true;
    if (closed) ok = false;                                                          // 前日18時をすぎて受付終了
    else if (t + minutes > CLOSE_MIN) ok = false;                                         // メニューの時間が入りきらない
    else if (busy.some(b => t < b.start + b.minutes && b.start < t + minutes)) ok = false; // すでに予約がある
    out.push({ t, ok });
  }
  return out;
}
function dayStatus(staffId, date, minutes, excludeId) {
  const s = staffById(staffId);
  if (date < todayYmd() || date > lastYmd()) return 'out';
  if (isClosed(date)) return 'closed';
  if (!s || !s.workDays.includes(date)) return 'off';
  return slotsFor(staffId, date, minutes, excludeId).some(x => x.ok) ? 'ok' : 'full';
}
// 予約日の前日18時をすぎたら、その日の新しいご予約・日にちの変更は受けつけない
function isClosed(date) { return now() >= deadlineOf({ date }); }
function deadlineOf(b) { const d = addDays(fromYmd(b.date), -1); d.setHours(DEADLINE_HOUR, 0, 0, 0); return d; }
function canChange(b) { return b.status === 'active' && now() < deadlineOf(b); }
function isPast(b) { const end = fromYmd(b.date); end.setMinutes(b.start + b.minutes); return now() >= end; }
function newBookingNo() {
  let no;
  do { no = 'N' + Math.floor(1000 + Math.random() * 9000); } while (data.bookings.some(b => b.id === no));
  return no;
}
function nextWorkDay(s) { const t = todayYmd(), l = lastYmd(); return s.workDays.filter(d => d >= t && d <= l).sort()[0]; }

/* ===== 画面の状態 ===== */
const ui = {
  view: 'customer',
  page: 'home',        // home | book | done | lookup | manage
  step: 1,
  bk: {},              // 予約中の内容
  form: { name: '', phone: '' },
  errors: {},
  lookup: { no: '', phone: '', err: '' },
  manageId: null,
  confirmCancel: false,
  doneId: null,
  doneKind: '',
  shopTab: 'list',
  list: { range: 'future', staff: 'all', showCancelled: true },
  attStaff: null,
  attMonth: null,
};

/* ===== カレンダー ===== */
function calendarHTML(monthYmd, dayFn, navMin, navMax) {
  const first = fromYmd(monthYmd);
  const y = first.getFullYear(), m = first.getMonth();
  const daysIn = new Date(y, m + 1, 0).getDate();
  const prevOk = !navMin || ymd(new Date(y, m, 0)) >= navMin;
  const nextOk = !navMax || ymd(new Date(y, m + 1, 1)) <= navMax;
  let h = `<div class="cal-head">
    <button class="cal-nav" data-act="calmonth" data-d="-1" ${prevOk ? '' : 'disabled'} aria-label="前の月">‹</button>
    <span class="m">${y}年${m + 1}月</span>
    <button class="cal-nav" data-act="calmonth" data-d="1" ${nextOk ? '' : 'disabled'} aria-label="次の月">›</button>
  </div><div class="cal">`;
  WD.split('').forEach((w, i) => { h += `<div class="wd ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</div>`; });
  for (let i = 0; i < first.getDay(); i++) h += `<div class="day empty"></div>`;
  for (let d = 1; d <= daysIn; d++) {
    const ds = `${y}-${pad(m + 1)}-${pad(d)}`;
    const o = dayFn(ds);
    h += `<button class="day ${o.cls || ''} ${ds === todayYmd() ? 'today' : ''}" data-act="calday" data-date="${ds}" ${o.disabled ? 'disabled' : ''} title="${esc(o.title || '')}">${d}${o.sub ? `<small>${o.sub}</small>` : '<small>&nbsp;</small>'}</button>`;
  }
  return h + '</div>';
}
function monthOf(ds) { return ds.slice(0, 8) + '01'; }
function shiftMonth(ms, n) { const d = fromYmd(ms); return ymd(new Date(d.getFullYear(), d.getMonth() + n, 1)); }

  let h = `<div class="card"><h2>ネイリスト</h2>`;
  data.staff.forEach(s => {
    const used = data.bookings.some(b => b.staffId === s.id && b.status === 'active');
    h += `<div class="row-form" style="grid-template-columns:1fr auto" data-sid="${s.id}">
      <input type="text" value="${esc(s.name)}" data-k="name">
      <span style="display:flex;gap:6px"><button class="btn btn-primary btn-small" data-act="saveStaff" data-id="${s.id}">保存</button>
      <button class="btn btn-quiet btn-small" data-act="delStaff" data-id="${s.id}" ${used ? 'disabled title="ご予約があるため削除できません"' : ''}>削除</button></span></div>`;
  });
  h += `<p class="muted">ご予約が入っているネイリストさんは削除できません。</p></div>
  <div class="card"><h2>ネイリストを追加する</h2>
    <div class="row-form" style="grid-template-columns:1fr auto" data-sid="new">
      <input type="text" placeholder="お名前" data-k="name">
      <button class="btn btn-primary btn-small" data-act="addStaff">追加</button></div>
    <p class="muted">追加したら「出勤日」のタブで出勤する日を決めてください。</p></div>`;
  return h;
}
function renderDebug() {
  const v = data.debugNow ? data.debugNow.slice(0, 16) : '';
  return `<div class="card"><h2>いまの日時を変えて試す</h2>
    <p class="muted">「前日18時をすぎるとキャンセルできない」などを確かめるための機能です。ここで決めた日時を「いま」として動きます。</p>
    <label class="f"><span>いまの日時</span><input type="datetime-local" id="dbg-now" value="${v}"></label>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary btn-small" data-act="setNow">この日時にする</button>
    <button class="btn btn-quiet btn-small" data-act="clearNow">本当の日時に戻す</button></div>
    <div class="note">試し方の例:予約一覧で、ある予約の日にちを見ます。その前の日の 17:59 にすると、お客様の画面からキャンセルできます。18:00 にすると、やさしいご案内が出てキャンセルできなくなります。</div>
  </div>
  <div class="card"><h2>見本のデータに戻す</h2>
    <p class="muted">入っている予約・メニュー・出勤日をすべて消して、最初の見本の状態に戻します。見本のお客様の名前と電話番号は作り物です。</p>
    <button class="btn btn-quiet btn-small" data-act="reset">見本のデータに戻す</button></div>`;
}

/* ===== 操作 ===== */
function slotGoneMsg(date) {
  return isClosed(date)
    ? '申し訳ありません、前日18時をすぎたため、その日のご予約は受付を終了いたしました。別の日にちをお選びください。'
    : '申し訳ありません、そのお時間はご予約が埋まってしまいました。別のお時間をお選びください。';
}
let pendingConfirm = null;
function askConfirm(msg, okLabel, onOk) {
  pendingConfirm = onOk;
  document.getElementById('dialog').innerHTML = `<div class="overlay"><div class="dialog" role="dialog" aria-modal="true">
    <p>${esc(msg)}</p><div class="actions end"><button class="btn btn-quiet" data-act="dlgNo">やめる</button>
    <button class="btn btn-primary" data-act="dlgYes">${esc(okLabel)}</button></div></div></div>`;
}
function closeConfirm() { pendingConfirm = null; document.getElementById('dialog').innerHTML = ''; }
function toast(msg) {
  const el = document.getElementById('toast');
  el.innerHTML = `<div class="toast">${esc(msg)}</div>`;
  clearTimeout(toast._t); toast._t = setTimeout(() => { el.innerHTML = ''; }, 2600);
}
function go(page) { ui.page = page; render(); window.scrollTo(0, 0); }
function readRow(sel) {
  const row = document.querySelector(sel); const o = {};
  row.querySelectorAll('[data-k]').forEach(i => { o[i.dataset.k] = i.value; });
  return o;
}

const ACT = {
  view: d => { ui.view = d.v; render(); window.scrollTo(0, 0); },
  home: () => { ui.bk = {}; ui.confirmCancel = false; go('home'); },
  startBook: () => { ui.bk = {}; ui.step = 1; ui.form = { name: '', phone: '' }; ui.errors = {}; go('book'); },
  goLookup: () => { ui.lookup.err = ''; go('lookup'); },
  pickStaff: d => {
    if (ui.bk.staffId !== d.id) ui.bk = { staffId: d.id, menuId: ui.bk.menuId };
    ui.step = 2; go('book');
  },
  pickMenu: d => {
    if (ui.bk.menuId !== d.id) { ui.bk.date = null; ui.bk.start = null; }
    ui.bk.menuId = d.id; ui.step = 3; go('book');
  },
  calmonth: d => {
    if (ui.view === 'shop') ui.attMonth = shiftMonth(ui.attMonth, +d.d);
    else ui.bk.month = shiftMonth(ui.bk.month, +d.d);
    render();
  },
  calday: d => {
    if (ui.view === 'shop') return toggleWork(d.date);
    ui.bk.date = d.date; ui.bk.start = null; render();
  },
  pickTime: d => { ui.bk.start = +d.t; render(); },
  step: d => { saveFormInputs(); ui.step = +d.s; ui.errors = {}; go('book'); },
  submitBook: () => {
    saveFormInputs();
    const e = {};
    if (!ui.form.name.trim()) e.name = 'お名前をご入力ください。';
    const ph = normPhone(ui.form.phone);
    if (!/^0\d{9,10}$/.test(ph)) e.phone = 'お電話番号を、数字10けたか11けたでご入力ください。';
    ui.errors = e;
    if (Object.keys(e).length) return render();
    const b = ui.bk, m = menuById(b.menuId);
    if (!slotsFor(b.staffId, b.date, m.minutes).find(x => x.t === b.start && x.ok)) {
      toast(slotGoneMsg(b.date));
      ui.step = 3; ui.bk.start = null; return go('book');
    }
    const no = newBookingNo();
    data.bookings.push({ id: no, staffId: b.staffId, menuId: m.id, menuName: m.name, minutes: m.minutes, price: m.price,
      date: b.date, start: b.start, name: ui.form.name.trim(), phone: ph, status: 'active', createdAt: new Date().toISOString() });
    persist();
    ui.doneId = no; ui.doneKind = 'new'; ui.bk = {}; go('done');
  },
  doLookup: () => {
    const no = document.getElementById('l-no').value.trim().toUpperCase().replace(/[Ｎｎ]/g, 'N');
    const noD = normPhone(no);
    const ph = normPhone(document.getElementById('l-phone').value);
    ui.lookup.no = document.getElementById('l-no').value; ui.lookup.phone = document.getElementById('l-phone').value;
    const b = data.bookings.find(x => (x.id === no || x.id === 'N' + noD) && x.phone === ph);
    if (!b) { ui.lookup.err = 'ご予約が見つかりませんでした。お手数ですが、予約番号とお電話番号をもう一度ご確認ください。'; return render(); }
    ui.lookup.err = ''; ui.manageId = b.id; ui.confirmCancel = false; go('manage');
  },
  cancelAsk: () => { ui.confirmCancel = true; render(); },
  cancelNo: () => { ui.confirmCancel = false; render(); },
  cancelYes: () => {
    const b = data.bookings.find(x => x.id === ui.manageId);
    ui.confirmCancel = false;
    if (!canChange(b)) return render();
    b.status = 'cancelled'; b.cancelledAt = new Date().toISOString(); persist();
    toast('ご予約をキャンセルいたしました。');
    render();
  },
  startChange: () => {
    const b = data.bookings.find(x => x.id === ui.manageId);
    if (!canChange(b)) return render();
    ui.bk = { staffId: b.staffId, menuId: b.menuId, editingId: b.id, date: null, start: null, month: monthOf(b.date < todayYmd() ? todayYmd() : b.date) };
    // メニューが削除・変更されていても、予約時の時間で空きを調べる
    if (!menuById(b.menuId) || menuById(b.menuId).minutes !== b.minutes) {
      ui.bk.menuId = '__booking__';
    }
    ui.step = 3; go('book');
  },
  backToManage: () => { ui.bk = {}; go('manage'); },
  submitChange: () => {
    const b = data.bookings.find(x => x.id === ui.bk.editingId);
    if (!canChange(b)) { ui.bk = {}; return go('manage'); }
    if (!slotsFor(b.staffId, ui.bk.date, b.minutes, b.id).find(x => x.t === ui.bk.start && x.ok)) {
      toast(slotGoneMsg(ui.bk.date));
      ui.step = 3; ui.bk.start = null; return go('book');
    }
    b.date = ui.bk.date; b.start = ui.bk.start; b.changedAt = new Date().toISOString(); persist();
    ui.doneId = b.id; ui.doneKind = 'change'; ui.bk = {}; go('done');
  },

  shopTab: d => { ui.shopTab = d.t; render(); },
  bulkWd: d => {
    const s = staffById(ui.attStaff); const ms = fromYmd(ui.attMonth);
    const y = ms.getFullYear(), m = ms.getMonth(), n = new Date(y, m + 1, 0).getDate();
    const on = d.on === '1'; let skipped = 0;
    for (let i = 1; i <= n; i++) {
      const dt = new Date(y, m, i); const ds = ymd(dt);
      if (dt.getDay() !== +d.wd || ds < todayYmd()) continue;
      if (on) { if (!s.workDays.includes(ds)) s.workDays.push(ds); }
      else {
        if (data.bookings.some(b => b.status === 'active' && b.staffId === s.id && b.date === ds)) { skipped++; continue; }
        s.workDays = s.workDays.filter(x => x !== ds);
      }
    }
    persist(); render();
    toast(skipped ? `ご予約が入っている${skipped}日は、出勤のままにしました。` : '出勤日を更新しました。');
  },
  saveMenu: d => {
    const v = readRow(`[data-mid="${d.id}"]`); const m = menuById(d.id);
    if (!v.name.trim()) return toast('メニューの名前を入れてください。');
    m.name = v.name.trim(); m.minutes = +v.minutes; m.price = Math.max(0, +v.price || 0);
    persist(); render(); toast('メニューを保存しました。');
  },
  delMenu: d => {
    const m = menuById(d.id);
    askConfirm(`「${m.name}」を削除しますか?(入っているご予約はそのまま残ります)`, '削除する', () => {
      data.menus = data.menus.filter(x => x.id !== d.id); persist(); render(); toast('メニューを削除しました。');
    });
  },
  addMenu: () => {
    const v = readRow('[data-mid="new"]');
    if (!v.name.trim()) return toast('メニューの名前を入れてください。');
    data.menus.push({ id: 'm' + Date.now(), name: v.name.trim(), minutes: +v.minutes, price: Math.max(0, +v.price || 0) });
    persist(); render(); toast('メニューを追加しました。');
  },
  saveStaff: d => {
    const v = readRow(`[data-sid="${d.id}"]`);
    if (!v.name.trim()) return toast('お名前を入れてください。');
    staffById(d.id).name = v.name.trim(); persist(); render(); toast('保存しました。');
  },
  delStaff: d => {
    const s = staffById(d.id);
    askConfirm(`「${s.name}」さんを削除しますか?`, '削除する', () => {
      data.staff = data.staff.filter(x => x.id !== d.id); persist(); render(); toast('削除しました。');
    });
  },
  addStaff: () => {
    const v = readRow('[data-sid="new"]');
    if (!v.name.trim()) return toast('お名前を入れてください。');
    const id = 's' + Date.now();
    data.staff.push({ id, name: v.name.trim(), workDays: [] }); ui.attStaff = id;
    persist(); render(); toast('追加しました。「出勤日」のタブで出勤日を決めてください。');
  },
  setNow: () => {
    const v = document.getElementById('dbg-now').value;
    if (!v) return toast('日時を入れてください。');
    data.debugNow = v; persist(); render(); toast('いまの日時を変えました。');
  },
  clearNow: () => { data.debugNow = null; persist(); render(); toast('本当の日時に戻しました。'); },
  dlgNo: () => closeConfirm(),
  dlgYes: () => { const f = pendingConfirm; closeConfirm(); if (f) f(); },
  reset: () => {
    askConfirm('入っている予約などをすべて消して、見本のデータに戻しますか?', '見本のデータに戻す', () => {
      data = seed(); persist(); ui.attStaff = null; ui.attMonth = null; render(); toast('見本のデータに戻しました。');
    });
  },
};

function toggleWork(ds) {
  const s = staffById(ui.attStaff);
  if (s.workDays.includes(ds)) {
    const n = data.bookings.filter(b => b.status === 'active' && b.staffId === s.id && b.date === ds).length;
    const off = () => { s.workDays = s.workDays.filter(x => x !== ds); persist(); render(); };
    if (n) return askConfirm(`この日は ${n} 件のご予約が入っています。お休みにしても、入っているご予約は消えません。お休みにしますか?`, 'お休みにする', off);
    return off();
  }
  s.workDays.push(ds);
  persist(); render();
}
function saveFormInputs() {
  const n = document.getElementById('f-name'), p = document.getElementById('f-phone');
  if (n) ui.form.name = n.value;
  if (p) ui.form.phone = p.value;
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset, el); }
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'lf-range') { ui.list.range = e.target.value; render(); }
  if (id === 'lf-staff') { ui.list.staff = e.target.value; render(); }
  if (id === 'lf-cancel') { ui.list.showCancelled = e.target.checked; render(); }
  if (id === 'att-staff') { ui.attStaff = e.target.value; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.id === 'l-no' || e.target.id === 'l-phone')) ACT.doLookup();
});
window.addEventListener('storage', () => { data = load(); render(); });

render();
</script>
</body>
</html>
